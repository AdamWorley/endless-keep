# Checks the game builds on every change. Cloudflare Pages deploys it (Git integration, connected to this repo).
name: Game
on:
  push:
    branches: [main]
    paths: [endless-keep.html, "game/**", "pwa/**", bot/sim.mjs, bot/policy.mjs, wrangler.jsonc, package.json, package-lock.json, .github/workflows/game.yml]
  pull_request:
    paths: [endless-keep.html, "game/**", "pwa/**", bot/sim.mjs, bot/policy.mjs, wrangler.jsonc, package.json, package-lock.json, .github/workflows/game.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Build and check
        run: npm run build
