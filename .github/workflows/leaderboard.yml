# Tests the leaderboard server on every change; deploys it to Cloudflare once it's set up.
# Deploy needs the CLOUDFLARE_API_TOKEN repo secret and a real database_id in wrangler.jsonc; until then only the tests
# run. Optional secrets: CLOUDFLARE_ACCOUNT_ID (only if the token can see several accounts) and HASH_SALT (sent to the
# Worker as a secret on each deploy; set it once and never change it, or players lose their link to their scores).
name: Leaderboard
on:
  push:
    branches: [main]
    paths: ["leaderboard/**", .github/workflows/leaderboard.yml]
  pull_request:
    paths: ["leaderboard/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: leaderboard }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HASH_SALT: ${{ secrets.HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: leaderboard/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Ready to deploy?
        id: ready
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipping deploy: the CLOUDFLARE_API_TOKEN secret isn't set"; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_AFTER_CREATE wrangler.jsonc; then
            echo "::notice::Skipping deploy: put the D1 database_id in leaderboard/wrangler.jsonc"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Apply schema
        if: steps.ready.outputs.ok == 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler d1 execute endless-keep-leaderboard --remote --file schema.sql --yes   # every statement is IF NOT EXISTS
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          if [ -n "$HASH_SALT" ]; then
            f="$RUNNER_TEMP/secrets.json"; node -e 'process.stdout.write(JSON.stringify({ HASH_SALT: process.env.HASH_SALT }))' > "$f"
            npx wrangler deploy --secrets-file "$f"; rm -f "$f"
          else echo "::warning::HASH_SALT secret isn't set; the Worker keeps whatever salt it already has (or none)"; npx wrangler deploy; fi
