# Tests the leaderboard server on every change; deploys it to Cloudflare once it's set up.
# Deploy needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and a real database_id in wrangler.jsonc;
# until then the deploy step is skipped and only the tests run.
name: Leaderboard
on:
  push:
    branches: [main]
    paths: ["leaderboard/**", .github/workflows/leaderboard.yml]
  pull_request:
    paths: ["leaderboard/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: leaderboard }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: leaderboard/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Ready to deploy?
        id: ready
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets aren't set"; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_AFTER_CREATE wrangler.jsonc; then
            echo "::notice::Skipping deploy: put the D1 database_id in leaderboard/wrangler.jsonc"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Apply schema
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 execute endless-keep-leaderboard --remote --file schema.sql   # every statement is IF NOT EXISTS
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy
