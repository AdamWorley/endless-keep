# Tests the leaderboard server on every change, and on game changes (the tests check the server's copies of game rules). Cloudflare deploys it (Workers Builds, connected to this repo).
name: Leaderboard
on:
  push:
    branches: [main]
    paths: ["leaderboard/**", endless-keep.html, "game/**", pwa/inline.mjs, bot/sim.mjs, .github/workflows/leaderboard.yml]
  pull_request:
    paths: ["leaderboard/**", endless-keep.html, "game/**", pwa/inline.mjs, bot/sim.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: leaderboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: leaderboard/package-lock.json }
      - run: npm ci
      - run: npm test
