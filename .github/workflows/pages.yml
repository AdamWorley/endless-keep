# Builds the installable game from endless-keep.html + pwa/ and publishes it to GitHub Pages.
name: Deploy game
on:
  push:
    branches: [main]
    paths: [endless-keep.html, "pwa/**", .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        run: BUILD_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" sh pwa/build.sh && touch dist/.nojekyll
      - name: Check build
        run: node pwa/check.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
